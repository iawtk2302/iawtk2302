,sans-serif" font-size="12" fill="#94a3b8">solving and shows immense potential</text><text x="333" y="234" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">for professional development.</text><text x="333" y="298" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Duy Ha</text><text x="333" y="316" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#64748b">Senior Mobile Eng., VinSmart Future</text><rect x="594" y="92" width="262" height="240" rx="12" fill="#06181a" stroke="#0f766e"/><text x="610" y="136" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#2dd4bf">“</text><text x="610" y="158" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">Khôi proved to be a proactive and</text><text x="610" y="177" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">reliable team member. He</text><text x="610" y="196" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">consistently took the initiative to</text><text x="610" y="215" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">understand the work requirements</text><text x="610" y="234" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">thoroughly and actively seek</text><text x="610" y="253" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">solutions to ensure product quality.</text><text x="610" y="298" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Kim Phong Tran</text><text x="610" y="316" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#64748b">Founder, 003Lab</text><rect x="40" y="347" width="262" height="240" rx="12" fill="#06181a" stroke=