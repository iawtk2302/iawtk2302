ode',Menlo,Consolas,monospace" font-size="11" fill="#64748b">Mobile Developer, ExecutionLab</text><rect x="594" y="347" width="262" height="240" rx="12" fill="#06181a" stroke="#0f766e"/><text x="610" y="391" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#2dd4bf">“</text><text x="610" y="413" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">He demonstrated a strong</text><text x="610" y="432" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">understanding of Flutter concepts</text><text x="610" y="451" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">and was able to quickly grasp new</text><text x="610" y="470" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">technologies. His problem-solving</text><text x="610" y="489" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">skills and attention to detail were</text><text x="610" y="508" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">particularly noteworthy.</text><text x="610" y="553" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Nguyen Tien Vi</text><text x="610" y="571" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#64748b">Software Engineer, Zalo</text>
